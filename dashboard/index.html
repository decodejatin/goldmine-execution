<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goldmine Engine | Live Dashboard</title>
    <!-- Use Outfit font for a premium look -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js for equity curve -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --surface-color: rgba(31, 33, 42, 0.5);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-glow: rgba(76, 201, 240, 0.4);
            --text-primary: #f8f9fa;
            --text-secondary: #adb5bd;
            --success-color: #4ade80;
            --danger-color: #f87171;
            --accent-color: #4cc9f0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(76, 201, 240, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(114, 9, 183, 0.15), transparent 25%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(11, 12, 16, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #f8f9fa, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            background: var(--surface-color);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--success-color);
            box-shadow: 0 0 10px var(--success-color);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(74, 222, 128, 0); }
            100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
        }

        main {
            padding: 2rem 3rem;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            flex-grow: 1;
        }

        .glass-panel {
            background: var(--surface-color);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-panel:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px 0 var(--accent-glow);
        }

        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Chart container */
        .chart-container {
            position: relative;
            height: 350px;
            width: 100%;
        }

        /* Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .metric-card {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .metric-card .title {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .metric-card .value {
            font-size: 2rem;
            font-weight: 700;
        }

        .profit { color: var(--success-color); }
        .loss { color: var(--danger-color); }

        /* Trade History Table */
        .table-container {
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
        }

        .table-container::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .table-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        th {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            background: rgba(20, 22, 30, 0.95);
            backdrop-filter: blur(8px);
        }

        tbody tr {
            transition: background 0.2s ease;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .badge.long { background: rgba(74, 222, 128, 0.15); color: var(--success-color); }
        .badge.short { background: rgba(248, 113, 113, 0.15); color: var(--danger-color); }

        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Goldmine <span>Engine</span></h1>
        <div class="status-indicator" id="ws-status">
            <div class="dot" id="ws-dot"></div>
            <span id="ws-text">Engine Online (Live)</span>
        </div>
    </header>

    <main>
        <!-- Left Column -->
        <div style="display: flex; flex-direction: column; gap: 2rem;">
            
            <div class="metrics-grid">
                <div class="metric-card">
                    <span class="title">Current Equity</span>
                    <span class="value" id="val-equity">$--.--</span>
                </div>
                <div class="metric-card">
                    <span class="title">Realized PnL</span>
                    <span class="value profit" id="val-pnl">+$--.--</span>
                </div>
                <div class="metric-card">
                    <span class="title">Max Drawdown</span>
                    <span class="value loss" id="val-dd">--.--%</span>
                </div>
                <div class="metric-card">
                    <span class="title">Total Trades</span>
                    <span class="value" id="val-trades">--</span>
                </div>
            </div>

            <div class="glass-panel">
                <h2>📈 Equity Curve</h2>
                <div class="chart-container">
                    <canvas id="equityChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Right Column -->
        <div class="glass-panel" style="display: flex; flex-direction: column; height: 100%;">
            <h2>⚡ Recent Executions</h2>
            <div class="table-container">
                <table id="tradesTable">
                    <thead>
                        <tr>
                            <th>Side</th>
                            <th>Entry</th>
                            <th>Exit</th>
                            <th>PnL</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Initialize Chart
        const ctx = document.getElementById('equityChart').getContext('2d');
        
        // Gradient fill for chart
        let gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, 'rgba(76, 201, 240, 0.5)');
        gradient.addColorStop(1, 'rgba(76, 201, 240, 0.0)');

        const equityChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Equity ($)',
                    data: [],
                    borderColor: '#4cc9f0',
                    backgroundColor: gradient,
                    borderWidth: 2,
                    pointRadius: 0,
                    pointHoverRadius: 6,
                    fill: true,
                    tension: 0.4 // Smooth curves
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        mode: 'index',
                        intersect: false,
                        backgroundColor: 'rgba(11, 12, 16, 0.9)',
                        titleFont: { family: 'Outfit', size: 14 },
                        bodyFont: { family: 'Outfit', size: 14 },
                        padding: 12,
                        borderColor: 'rgba(255,255,255,0.1)',
                        borderWidth: 1
                    }
                },
                scales: {
                    x: {
                        display: false // Hide X axis labels for clean look
                    },
                    y: {
                        grid: {
                            color: 'rgba(255, 255, 255, 0.05)',
                            drawBorder: false
                        },
                        ticks: {
                            color: '#adb5bd',
                            font: { family: 'Outfit', size: 12 },
                            callback: function(value) { return '$' + value.toFixed(2); }
                        }
                    }
                },
                interaction: {
                    mode: 'nearest',
                    axis: 'x',
                    intersect: false
                }
            }
        });

        // Application State
        let totalTrades = 0;

        // Fetch initial data via REST
        async function fetchInitialData() {
            try {
                // Fetch Equity
                const eqRes = await fetch('/api/equity?limit=100');
                if(eqRes.ok) {
                    const eqData = await eqRes.json();
                    
                    if(eqData.length > 0) {
                        const labels = eqData.map(e => new Date(e.timestamp).toLocaleTimeString());
                        const data = eqData.map(e => e.equity);
                        
                        equityChart.data.labels = labels;
                        equityChart.data.datasets[0].data = data;
                        equityChart.update();

                        const latest = eqData[eqData.length - 1];
                        updateMetrics(latest.equity, latest.drawdown_pct);
                    }
                }

                // Fetch Trades
                const trRes = await fetch('/api/trades?limit=20');
                if(trRes.ok) {
                    const trData = await trRes.json();
                    totalTrades = trData.length; // placeholder
                    document.getElementById('val-trades').textContent = totalTrades;
                    
                    const tbody = document.querySelector('#tradesTable tbody');
                    tbody.innerHTML = '';
                    trData.forEach(t => addTradeToTable(t));
                }
            } catch (err) {
                console.error("Failed to load initial data", err);
            }
        }

        function updateMetrics(equity, dd) {
            document.getElementById('val-equity').textContent = `$${equity.toFixed(2)}`;
            document.getElementById('val-dd').textContent = `${dd.toFixed(2)}%`;
            
            // Calc PnL assuming start is 10.0
            const pnl = equity - 10.0;
            const pnlEl = document.getElementById('val-pnl');
            pnlEl.textContent = `${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}`;
            pnlEl.className = pnl >= 0 ? 'value profit' : 'value loss';
        }

        function addTradeToTable(trade) {
            const tbody = document.querySelector('#tradesTable tbody');
            const tr = document.createElement('tr');
            
            const pnlClass = trade.pnl_usd >= 0 ? 'profit' : 'loss';
            const sign = trade.pnl_usd >= 0 ? '+' : '';
            
            tr.innerHTML = `
                <td><span class="badge ${trade.direction.toLowerCase()}">${trade.direction}</span></td>
                <td>$${trade.entry_price.toFixed(2)}</td>
                <td>$${trade.exit_price.toFixed(2)}</td>
                <td class="${pnlClass}">${sign}$${trade.pnl_usd.toFixed(2)}</td>
            `;
            
            // Add to top
            tbody.insertBefore(tr, tbody.firstChild);
            
            // Keep only latest 50 in DOM
            if (tbody.children.length > 50) {
                tbody.removeChild(tbody.lastChild);
            }
        }

        // WebSocket Connection
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/stream`;
            const ws = new WebSocket(wsUrl);

            const dot = document.getElementById('ws-dot');
            const text = document.getElementById('ws-text');

            ws.onopen = () => {
                dot.style.backgroundColor = 'var(--success-color)';
                dot.style.boxShadow = '0 0 10px var(--success-color)';
                dot.style.animation = 'pulse 2s infinite';
                text.textContent = 'Engine Online (Live)';
            };

            ws.onclose = () => {
                dot.style.backgroundColor = 'var(--danger-color)';
                dot.style.boxShadow = 'none';
                dot.style.animation = 'none';
                text.textContent = 'Connection Lost - Retrying...';
                setTimeout(connectWebSocket, 3000);
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                
                if (msg.type === 'trade') {
                    addTradeToTable(msg.data);
                    totalTrades++;
                    document.getElementById('val-trades').textContent = totalTrades;
                } else if (msg.type === 'equity') {
                    const labels = equityChart.data.labels;
                    const data = equityChart.data.datasets[0].data;
                    
                    labels.push(new Date(msg.data.timestamp).toLocaleTimeString());
                    data.push(msg.data.equity);
                    
                    if (labels.length > 100) {
                        labels.shift();
                        data.shift();
                    }
                    
                    equityChart.update();
                    updateMetrics(msg.data.equity, msg.data.drawdown_pct);
                }
            };
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            fetchInitialData();
            connectWebSocket();
        });

    </script>
</body>
</html>
